name: Build

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

jobs:
  
  build:
    
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            project: Linux
          - os: windows-latest
            project: Windows
        
    runs-on: ${{ matrix.os }}
    
    steps:
      
      - uses: actions/checkout@v7.0.1
      
      - run: dotnet publish -o OUT
        working-directory: Soundboword.${{ matrix.project }}
      
      - uses: actions/upload-artifact@v7.0.1
        with:
          path: ${{ matrix.project }}/OUT/
          name: ${{ matrix.project }}
          if-no-files-found: error